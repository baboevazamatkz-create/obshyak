name: expense_tracker
description: "A minimalist expense tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Needed on the web build: Flutter picks platform-adaptive widgets at
  # runtime there, so on an iPhone the text-selection controls come from the
  # Cupertino set and reference its icon font.
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  intl: ^0.20.3
  uuid: ^4.5.1
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  image_picker: ^1.2.3
  http: ^1.6.0
  image: ^4.9.2
  camera: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    # The app's mark: a tenge coin with the four flatmates around it.
    # Regenerated by tool/generate_icons.py with the web icons, so the two
    # never drift apart.
    - assets/obshak_mark.png
    - assets/coin.png
    # A cartoon face per flatmate, drawn by tool/generate_avatars.py.
    - assets/avatars/

  fonts:
    # The wordmark only. A high-contrast serif reads as expensive where a
    # sans reads as an interface, and one static weight costs 24 KB: subset
    # to Latin, since nothing in the app sets Russian in it.
    - family: PlayfairDisplay
      fonts:
        - asset: fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600

    # Everything else. Subset to Latin + Cyrillic (incl. the Kazakh letters
    # and the ₸/₽ signs the currency formatter needs) to keep the web
    # bundle small.
    - family: Onest
      fonts:
        - asset: fonts/Onest-Light.ttf
          weight: 300
        - asset: fonts/Onest-Regular.ttf
          weight: 400
        - asset: fonts/Onest-Medium.ttf
          weight: 500
        - asset: fonts/Onest-SemiBold.ttf
          weight: 600
        - asset: fonts/Onest-Bold.ttf
          weight: 700
