<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Replaced by the --base-href argument to `flutter build web`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Совместный учёт расходов и доходов">

  <!-- viewport-fit=cover handles the notch; locking the scale stops Safari
       from zooming the page in every time an amount field is focused. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Paints the iOS status bar area to match the app's background. -->
  <meta name="theme-color" content="#141318">

  <!-- Added to the Home screen, this is what makes it open without Safari's
       chrome and show the right name and icon. iOS reads apple-touch-icon
       rather than the manifest for the Home screen icon. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Общак">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Общак</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #141318;
      overscroll-behavior: none;
    }
    /* Shown until Flutter paints, so the app does not open on a blank page
       while the engine downloads: the four flatmates circling the coin. */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #loading .stage { position: relative; width: 200px; height: 200px; }
    #loading .coin {
      position: absolute;
      left: 74px; top: 74px;
      width: 52px; height: 52px;
    }
    #loading .orbit {
      position: absolute;
      inset: 0;
      animation: orbit 6s linear infinite;
    }
    /* Each face sits on the ring and turns back against it, so it stays
       upright while it goes round. */
    #loading .seat { position: absolute; width: 60px; height: 60px; }
    #loading .seat img {
      width: 60px; height: 60px;
      animation: orbit 6s linear infinite reverse;
    }
    #loading .s1 { left: 70px; top: 0; }
    #loading .s2 { left: 140px; top: 70px; }
    #loading .s3 { left: 70px; top: 140px; }
    #loading .s4 { left: 0; top: 70px; }
    @keyframes orbit {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #loading .orbit, #loading .seat img { animation: none; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="stage">
      <img class="coin" src="icons/coin.png" alt="">
      <div class="orbit">
        <div class="seat s1"><img src="avatars/azamat.png" alt=""></div>
        <div class="seat s2"><img src="avatars/aslan.png" alt=""></div>
        <div class="seat s3"><img src="avatars/muhammad.png" alt=""></div>
        <div class="seat s4"><img src="avatars/imran.png" alt=""></div>
      </div>
    </div>
  </div>

  <script>
    // Flutter fires this once it has painted its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading');
      if (loader) loader.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
