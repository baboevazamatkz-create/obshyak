<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Replaced by the --base-href argument to `flutter build web`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Совместный учёт расходов и доходов">

  <!-- viewport-fit=cover handles the notch; locking the scale stops Safari
       from zooming the page in every time an amount field is focused. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Paints the iOS status bar area to match the app's background. -->
  <meta name="theme-color" content="#141318">

  <!-- Added to the Home screen, this is what makes it open without Safari's
       chrome and show the right name and icon. iOS reads apple-touch-icon
       rather than the manifest for the Home screen icon. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Общак">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Общак</title>
  <link rel="manifest" href="manifest.json">

  <!-- Startup is a chain: the page, then Flutter's loader, then the app,
       and only once the app runs does it fetch Firebase and open a
       connection. Everything below is fetched now, alongside the rest, so
       each link of the chain finds its files already on the way. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
  <!-- The Firebase SDK the app loads, at the version firebase_core_web
       asks for; test/web_preload_test.dart fails if they ever differ. -->
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js" crossorigin>
  <script>
    // The app itself and the rendering engine, picked the way Flutter's
    // loader picks them: the smaller Chromium build of the engine where
    // the browser has what it needs, the full one elsewhere (Safari).
    // Only on a deployed build, whose files carry the BUILD stamp.
    (function () {
      var BUILD = '__BUILD__';
      if (BUILD.indexOf('__') === 0) return;
      function preload(href, as, mod) {
        var link = document.createElement('link');
        link.rel = mod ? 'modulepreload' : 'preload';
        if (!mod) link.as = as;
        if (as === 'fetch') link.crossOrigin = 'anonymous';
        link.href = href;
        document.head.appendChild(link);
      }
      var blink = navigator.vendor === 'Google Inc.' ||
          navigator.userAgent.indexOf('Edg/') >= 0;
      var chromium = blink && typeof ImageDecoder !== 'undefined' &&
          typeof Intl.v8BreakIterator !== 'undefined' &&
          typeof Intl.Segmenter !== 'undefined';
      var engine = chromium ? 'canvaskit/chromium/' : 'canvaskit/';
      preload('main.dart.js?v=' + BUILD, 'script');
      preload(engine + 'canvaskit.js', 'script', true);
      preload(engine + 'canvaskit.wasm', 'fetch');
    })();
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #141318;
      overscroll-behavior: none;
    }
    /* Shown until Flutter paints, so the app does not open on a blank page
       while the engine downloads: the four flatmates circling the coin. */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #loading .stage { position: relative; width: 200px; height: 200px; }
    #loading .coin {
      position: absolute;
      left: 74px; top: 74px;
      width: 52px; height: 52px;
    }
    #loading .orbit {
      position: absolute;
      inset: 0;
      animation: orbit 6s linear infinite;
    }
    /* Each face sits on the ring and turns back against it, so it stays
       upright while it goes round. */
    #loading .seat { position: absolute; width: 60px; height: 60px; }
    #loading .seat img {
      width: 60px; height: 60px;
      animation: orbit 6s linear infinite reverse;
    }
    #loading .s1 { left: 70px; top: 0; }
    #loading .s2 { left: 140px; top: 70px; }
    #loading .s3 { left: 70px; top: 140px; }
    #loading .s4 { left: 0; top: 70px; }
    @keyframes orbit {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #loading .orbit, #loading .seat img { animation: none; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="stage">
      <img class="coin" src="icons/coin.png" alt="">
      <div class="orbit">
        <div class="seat s1"><img src="avatars/azamat.png" alt=""></div>
        <div class="seat s2"><img src="avatars/aslan.png" alt=""></div>
        <div class="seat s3"><img src="avatars/muhammad.png" alt=""></div>
        <div class="seat s4"><img src="avatars/imran.png" alt=""></div>
      </div>
    </div>
  </div>

  <script>
    // Earlier versions installed Flutter's service worker, which keeps
    // serving an old copy of the app. Remove it and what it cached, so a
    // phone that has it picks up each new version on the next open.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (all) {
        all.forEach(function (registration) { registration.unregister(); });
      });
    }
    if (window.caches) {
      caches.keys().then(function (keys) {
        keys.forEach(function (key) { caches.delete(key); });
      });
    }

    // Picks up a new deploy without anyone having to close the app. The
    // deploy writes its commit into BUILD below and into build.txt next to
    // the page; when the two differ, this page is out of date and reloads.
    // A home-screen app on iOS can sit in the background for days without
    // reloading, so the check runs on every return to the app too -- but
    // only after a long absence, so that a trip to the photo picker never
    // reloads the page under a scan in progress.
    (function () {
      var BUILD = '__BUILD__';
      if (BUILD.indexOf('__') === 0) return;  // a local build, not a deploy
      var AWAY_MS = 5 * 60 * 1000;
      var hiddenAt = null;

      function check() {
        fetch('build.txt?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.text() : null; })
          .then(function (latest) {
            latest = latest && latest.trim();
            if (!latest || latest === BUILD) return;
            // Never loop: one reload per minute at most, in case a stale
            // copy of this page is still being served.
            try {
              var last = Number(sessionStorage.getItem('reloadedAt') || 0);
              if (Date.now() - last < 60 * 1000) return;
              sessionStorage.setItem('reloadedAt', String(Date.now()));
            } catch (e) {}
            location.reload();
          })
          .catch(function () {});
      }

      check();
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          hiddenAt = Date.now();
        } else if (hiddenAt && Date.now() - hiddenAt > AWAY_MS) {
          check();
        }
      });
    })();

    // Flutter fires this once it has painted its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading');
      if (loader) loader.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
