<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Replaced by the --base-href argument to `flutter build web`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Совместный учёт расходов и доходов">

  <!-- viewport-fit=cover handles the notch; locking the scale stops Safari
       from zooming the page in every time an amount field is focused. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Paints the iOS status bar area to match the app's background. -->
  <meta name="theme-color" content="#F6F2EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141318" media="(prefers-color-scheme: dark)">

  <!-- Added to the Home screen, this is what makes it open without Safari's
       chrome and show the right name and icon. iOS reads apple-touch-icon
       rather than the manifest for the Home screen icon. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Общак">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Общак</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F6F2EA;
      overscroll-behavior: none;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #141318; }
      #loading .bar { background: rgba(200, 168, 107, 0.22); }
      #loading .bar::after { background: #C8A86B; }
    }
    /* Shown until Flutter paints, so the app does not open on a blank page
       while the engine downloads. */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }
    #loading img { width: 96px; height: 96px; }
    #loading .bar {
      width: 132px;
      height: 3px;
      border-radius: 3px;
      background: rgba(154, 123, 68, 0.22);
      overflow: hidden;
    }
    #loading .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 3px;
      background: #9A7B44;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(330%); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>

  <script>
    // Flutter fires this once it has painted its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading');
      if (loader) loader.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
